<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - IT Solutions</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="loading-screen" id="loadingScreen">
        <div class="spinner"></div>
    </div>

    <nav class="navbar">
        <div class="container">
            <a href="/" class="logo">IT<span>Solutions</span></a>
            <div class="nav-links" id="navLinks">
                <a href="/">Home</a>
                <a href="/about">About</a>
                <a href="/services">Services</a>
                <a href="/contact">Contact</a>
            </div>
            <button class="hamburger" id="hamburger">
                <i class="fas fa-bars"></i>
            </button>
        </div>
    </nav>

    <section class="contact-section">
        <div class="container">
            <h1>Contact Us</h1>
            <div class="contact-card">
                <form id="contactForm">
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="5" required></textarea>
                    </div>
                    <button type="submit" class="btn">
                        <span id="submitText"><i class="fas fa-check"></i> Send Message</span>
                        <div class="spinner hidden" id="submitSpinner"></div>
                    </button>
                </form>
            </div>
        </div>
    </section>

    <div class="alert hidden" id="alert">
        <div class="alert-content">
            <p id="alertMessage">Your message is send!</p>
            <button id="closeAlert" class="close-btn">&times;</button>
        </div>
    </div>

    <footer class="footer">
        <div class="container">
          <p>&copy; 2025 IT Solutions. All rights reserved.</p>
          <div class="social-links">
            <a href="https://github.com/BimaARV/" target="_blank"><i class="fab fa-github"></i></a>
            <a href="https://x.com/bimaav23/" target="_blank"><i class="fab fa-twitter"></i></a>
            <a href="https://www.linkedin.com/in/dewangga-bima/" target="_blank"><i class="fab fa-linkedin"></i></a>
          </div>
        </div>
      </footer>

    <script src="/js/script.js"></script>
</body>
</html>
